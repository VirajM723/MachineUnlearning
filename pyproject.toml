[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munl"
version = "0.2.0"
description = "Exact machine unlearning with SISA training on FNMA loan data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Viraj Mankani" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "torch>=2.1",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter"]

[project.scripts]
munl = "munl.cli:main"

[tool.setuptools]
packages = ["munl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
